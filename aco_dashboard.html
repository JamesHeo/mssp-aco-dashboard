/* ─── SVG LINE CHART ─── */
function lineChart(data,opts){const w=opts.w||440,h=opts.h||140,pad={t:20,r:20,b:30,l:45};const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;const mn=opts.min??Math.min(...data.map(d=>d.v));const mx=opts.max??Math.max(...data.map(d=>d.v));const rng=mx-mn||1;
const pts=data.map((d,i)=>({x:pad.l+(i/(data.length-1))*cw,y:pad.t+ch-(d.v-mn)/rng*ch,v:d.v,l:d.l}));
const path=pts.map((p,i)=>((i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1))).join('');
let svg=`<svg class="svgchart" viewBox="0 0 ${w} ${h}">`;
for(let i=0;i<=4;i++){const y=pad.t+ch/4*i;const val=(mx-(mx-mn)/4*i);svg+=`<line class="grid-line" x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}"/><text x="${pad.l-6}" y="${y+3}" text-anchor="end">${opts.fmt?opts.fmt(val):Math.round(val)}</text>`;}
data.forEach((d,i)=>{if(i%Math.ceil(data.length/10)===0||i===data.length-1){const x=pad.l+(i/(data.length-1))*cw;svg+=`<text x="${x}" y="${h-5}" text-anchor="middle">${d.l}</text>`;}});
if(opts.ref){const ry=pad.t+ch-(opts.ref.v-mn)/rng*ch;svg+=`<line class="ref-line" x1="${pad.l}" y1="${ry}" x2="${w-pad.r}" y2="${ry}" stroke="${opts.ref.c||'var(--a400)'}"/><text x="${w-pad.r+4}" y="${ry+3}" fill="${opts.ref.c||'var(--a400)'}" style="font-size:5px">${opts.ref.l}</text>`;}
if(opts.ref2){const ry=pad.t+ch-(opts.ref2.v-mn)/rng*ch;svg+=`<line class="ref-line" x1="${pad.l}" y1="${ry}" x2="${w-pad.r}" y2="${ry}" stroke="${opts.ref2.c||'var(--g0-400)'}"/><text x="${w-pad.r+4}" y="${ry+3}" fill="${opts.ref2.c||'var(--g0-400)'}" style="font-size:5px">${opts.ref2.l}</text>`;}
svg+=`<path class="data-line" d="${path}" stroke="${opts.color||'var(--b500)'}"/>`;
pts.forEach(p=>{svg+=`<circle class="data-dot" cx="${p.x}" cy="${p.y}" fill="${opts.color||'var(--b500)'}"/>`});
svg+='</svg>';return svg;}

function calcWif(){
const checks=document.querySelectorAll('#wifChecks input[type=checkbox]');
const sliders=document.querySelectorAll('#wifChecks input[type=range]');
let savReadm=0,savSNF=0,savED=0,savPCP=0;
if(checks[0]?.checked){const eff=(sliders[0]?.value||20)/100;const tgt=(sliders[1]?.value||5)/100;savReadm=Math.round(D.aco.hiRisk*tgt*eff*18500);}
if(checks[1]?.checked){const days=parseFloat(sliders[2]?.value||2);savSNF=Math.round(days*420*1200);}
if(checks[2]?.checked){const eff=(sliders[3]?.value||30)/100;const tgt=(sliders[4]?.value||10)/100;savED=Math.round(D.aco.benes*0.4*tgt*eff*2800);}
if(checks[3]?.checked){savPCP=Math.round(-D.aco.benes*0.3*150);}
const totalSav=savReadm+savSNF+savED+savPCP;
const newTCOC=D.aco.tcoc*1e6-totalSav;const newPBPM=Math.round(newTCOC/(D.aco.benes*10));
const benchPBPM=1290;const newSavRate=((benchPBPM*D.aco.benes*10-newTCOC)/(benchPBPM*D.aco.benes*10)*100);
const qualBonus=(savReadm>0?1.2:0)+(savED>0?0.8:0)+(savPCP<0?0.5:0);const newQual=Math.min(100,D.aco.quality+qualBonus);
const sharedSav=Math.max(0,totalSav*0.75*(newQual>85?1:0.5));
const r=document.getElementById('wifRes');if(r){r.innerHTML=`
<div class="sim-result"><span class="sim-before">$${D.aco.tcoc}M</span><span class="sim-arrow">→</span><span class="sim-after" style="color:var(--g600)">$${(newTCOC/1e6).toFixed(1)}M</span></div>
<div style="font-size:11px;color:var(--tx3);margin-bottom:4px;padding:0 4px">TCOC</div>
<div class="sim-result"><span class="sim-before">$1,247</span><span class="sim-arrow">→</span><span class="sim-after" style="color:var(--g600)">$${$(newPBPM)}</span></div>
<div style="font-size:11px;color:var(--tx3);margin-bottom:4px;padding:0 4px">PBPM</div>
<div class="sim-result"><span class="sim-before">${D.aco.savings}%</span><span class="sim-arrow">→</span><span class="sim-after" style="color:${newSavRate>D.aco.savings?'var(--g600)':'var(--r600)'}">${Math.max(0,newSavRate).toFixed(1)}%</span></div>
<div style="font-size:11px;color:var(--tx3);margin-bottom:4px;padding:0 4px">Savings rate</div>
<div class="sim-result"><span class="sim-before">${D.aco.quality}</span><span class="sim-arrow">→</span><span class="sim-after" style="color:var(--g600)">${newQual.toFixed(1)}</span></div>
<div style="font-size:11px;color:var(--tx3);margin-bottom:4px;padding:0 4px">Quality score</div>
<div class="sim-result"><span class="sim-before">$${(D.aco.savings/100*benchPBPM*D.aco.benes*10*0.75/1e6).toFixed(1)}M</span><span class="sim-arrow">→</span><span class="sim-after" style="color:var(--g600)">$${(sharedSav/1e6).toFixed(1)}M</span></div>
<div style="font-size:11px;color:var(--tx3);padding:0 4px">Est. shared savings</div>`;}
const wf=document.getElementById('wifWF');if(wf){const maxH=100;const curH=maxH;const projH=Math.round(newTCOC/(D.aco.tcoc*1e6)*maxH);const items=[{l:'Current',v:'$'+D.aco.tcoc+'M',h:curH,c:'var(--g0-300)'}];
if(savReadm>0)items.push({l:'Readmit',v:'-$'+(savReadm/1e3).toFixed(0)+'K',h:Math.max(8,savReadm/(D.aco.tcoc*1e6)*maxH*8),c:'var(--g500)'});
if(savSNF>0)items.push({l:'SNF',v:'-$'+(savSNF/1e3).toFixed(0)+'K',h:Math.max(8,savSNF/(D.aco.tcoc*1e6)*maxH*8),c:'var(--g500)'});
if(savED>0)items.push({l:'ED',v:'-$'+(savED/1e3).toFixed(0)+'K',h:Math.max(8,savED/(D.aco.tcoc*1e6)*maxH*8),c:'var(--g500)'});
if(savPCP<0)items.push({l:'PCP cost',v:'+$'+(-savPCP/1e3).toFixed(0)+'K',h:Math.max(8,-savPCP/(D.aco.tcoc*1e6)*maxH*8),c:'var(--r400)'});
items.push({l:'Projected',v:'$'+(newTCOC/1e6).toFixed(1)+'M',h:projH,c:'var(--b500)'});
wf.innerHTML=items.map(b=>`<div class="wf-bar"><div class="wf-val">${b.v}</div><div class="wf-block" style="height:${b.h}px;background:${b.c}"></div><div class="wf-label">${b.l}</div></div>`).join('');}

function calcBenchmark(){const sl=document.getElementById('benchSlider');const bv=parseInt(sl.value);const actPBPM=1247;const months=D.aco.benes*10;const gross=(bv-actPBPM)*months;const savRate=gross/(bv*months)*100;const shared=Math.max(0,gross*0.75);

function calcWif2(){
const checks=[...document.querySelectorAll('#wifChecks input[type=checkbox]')];
const sliders=[...document.querySelectorAll('#wifChecks input[type=range]')];
const sv=k=>parseFloat((sliders.find(s=>s.dataset.k===k)||{value:0}).value)||0;
const RP=window._projRP;const leakTotal=4300000;
let savReadm=0,savED=0,savSNF=0,savDis=0,savLeak=0;
if(checks[0]?.checked){savReadm=Math.round(RP.readm.hiN*(sv('readmTgt')/100)*(sv('readmEff')/100)*RP.readm.costPer);}
if(checks[1]?.checked){savED=Math.round(RP.ed.hiN*(sv('edTgt')/100)*(sv('edEff')/100)*RP.ed.costPer);}
if(checks[2]?.checked){savSNF=Math.round(RP.snfLos.totalStays*sv('snfDays')*RP.snfLos.costPerDay);}
if(checks[3]?.checked){savDis=Math.round(RP.disease.hiN*(sv('disEff')/100)*RP.disease.costPer);}
if(checks[4]?.checked){savLeak=Math.round(leakTotal*(sv('leakPct')/100)*0.15);}
const totalSav=savReadm+savED+savSNF+savDis+savLeak;
const curTCOC=window._projTCOC;const newTCOC=curTCOC-totalSav/1e6;
const newPBPM=Math.round(newTCOC*1e6/(D.aco.benes*10));const benchPBPM=1290;
const newSavRate=((benchPBPM*D.aco.benes*10-newTCOC*1e6)/(benchPBPM*D.aco.benes*10)*100);
const qualBonus=(savReadm>0?1.2:0)+(savED>0?0.6:0)+(savDis>0?0.8:0)+(savSNF>0?0.4:0);
const newQual=Math.min(100,(window._projQual||D.aco.quality)+qualBonus);
const newLeak=leakTotal-savLeak/0.15*1;const leakRedPct=savLeak>0?((leakTotal-newLeak)/leakTotal*100):0;
const r=document.getElementById('wifRes');if(r){r.innerHTML=`
${[{l:'Projected TCOC',b:'$'+curTCOC.toFixed(1)+'M',a:'$'+newTCOC.toFixed(1)+'M',d:totalSav>0},{l:'Projected PBPM',b:'$'+$(window._projPBPM),a:'$'+$(newPBPM),d:newPBPM<window._projPBPM},{l:'Savings rate',b:(((benchPBPM*D.aco.benes*10-curTCOC*1e6)/(benchPBPM*D.aco.benes*10))*100).toFixed(1)+'%',a:newSavRate.toFixed(1)+'%',d:newSavRate>0},{l:'Quality score',b:(window._projQual||D.aco.quality).toFixed(1),a:newQual.toFixed(1),d:true},{l:'Leakage',b:'$4.3M',a:'$'+((leakTotal-savLeak/0.15)/1e6).toFixed(1)+'M',d:savLeak>0}].map(x=>`<div class="sim-result"><span style="font-size:12px;min-width:90px">${x.l}</span><span class="sim-before">${x.b}</span><span class="sim-arrow">→</span><span class="sim-after" style="color:${x.d?'var(--g600)':'var(--tx2)'}">${x.a}</span></div>`).join('')}`;}
const wf=document.getElementById('wifWF');if(wf){const maxH=100;const items=[{l:'Risk cost',v:'$'+curTCOC.toFixed(1)+'M',h:maxH,c:'var(--g0-300)'}];
if(savReadm>0)items.push({l:'Readmit ↓',v:'-$'+(savReadm/1e3).toFixed(0)+'K',h:Math.max(6,savReadm/(curTCOC*1e6)*maxH*10),c:'var(--g500)'});
if(savED>0)items.push({l:'ED ↓',v:'-$'+(savED/1e3).toFixed(0)+'K',h:Math.max(6,savED/(curTCOC*1e6)*maxH*10),c:'var(--g500)'});
if(savSNF>0)items.push({l:'SNF ↓',v:'-$'+(savSNF/1e3).toFixed(0)+'K',h:Math.max(6,savSNF/(curTCOC*1e6)*maxH*10),c:'var(--g500)'});
if(savDis>0)items.push({l:'Disease ↓',v:'-$'+(savDis/1e3).toFixed(0)+'K',h:Math.max(6,savDis/(curTCOC*1e6)*maxH*10),c:'var(--g500)'});
if(savLeak>0)items.push({l:'Leak ↓',v:'-$'+(savLeak/1e3).toFixed(0)+'K',h:Math.max(6,savLeak/(curTCOC*1e6)*maxH*10),c:'var(--t500)'});
items.push({l:'After intv.',v:'$'+newTCOC.toFixed(1)+'M',h:Math.round(newTCOC/curTCOC*maxH),c:'var(--b500)'});
wf.innerHTML=items.map(b=>`<div class="wf-bar"><div class="wf-val">${b.v}</div><div class="wf-block" style="height:${b.h}px;background:${b.c}"></div><div class="wf-label">${b.l}</div></div>`).join('');}
const sm=document.getElementById('wifSummary');if(sm){sm.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
<div class="ib"><div style="font-size:10px;color:var(--tx3)">Total savings</div><div style="font-size:16px;font-weight:600;color:var(--g600)">$${(totalSav/1e6).toFixed(2)}M</div></div>

function calcGS(){
const GP=window._gp;const checks=[...document.querySelectorAll('#gpChecks input[type=checkbox]')];
const sv=k=>{const s=document.querySelector('[data-k="'+k+'"]');return s?parseFloat(s.value):0;};
let savReadm=0,savED=0,savSNF=0,savMed=0;
if(checks[0]?.checked){savReadm=Math.round(42*(sv('gReadmTgt')/100)*(sv('gReadmEff')/100)*18500);}
if(checks[1]?.checked){savED=Math.round(GP.pts*0.4*(sv('gEdEff')/100)*2800*0.1);}
if(checks[2]?.checked){savSNF=Math.round(8*sv('gSnfDays')*1200);}
if(checks[3]?.checked){savMed=Math.round(GP.pts*0.15*(sv('gMedEff')/100)*1200);}
let provReadmDelta=0;const totalPts=D.provs.reduce((s,p)=>s+p.pts,0);
D.provs.forEach((p,i)=>{const newR=sv('gp'+i)||p.readm;const diff=p.readm-newR;provReadmDelta+=diff*(p.pts/totalPts);document.getElementById('gpv'+i).textContent=newR.toFixed(1)+'%';});
const provSav=Math.round(provReadmDelta/100*totalPts*18500*0.3);
const totalSav=savReadm+savED+savSNF+savMed+provSav;
const curTCOC=GP.pbpm*GP.pts*10;const newTCOC=curTCOC-totalSav;
const newPBPM=Math.round(newTCOC/(GP.pts*10));const newReadm=Math.max(5,GP.readm-provReadmDelta-(checks[0]?.checked?sv('gReadmEff')/100*GP.readm*0.15:0));
const qualBonus=(savReadm>0?2:0)+(savED>0?1:0)+(provReadmDelta>0?provReadmDelta*0.3:0);const newQual=Math.min(100,GP.qual+qualBonus);
const r=document.getElementById('gpRes');if(r){r.innerHTML=`
${[{l:'Group PBPM',b:'$'+$(GP.pbpm),a:'$'+$(newPBPM),d:newPBPM<GP.pbpm},{l:'Readmit%',b:GP.readm+'%',a:newReadm.toFixed(1)+'%',d:newReadm<GP.readm},{l:'Quality score',b:GP.qual,a:newQual.toFixed(1),d:newQual>GP.qual},{l:'Gap to PBPM target',b:'+$'+(GP.pbpm-GP.tgtPBPM),a:(newPBPM>GP.tgtPBPM?'+':'')+' $'+(newPBPM-GP.tgtPBPM),d:newPBPM<=GP.tgtPBPM},{l:'Gap to readmit target',b:'+'+((GP.readm-GP.tgtReadm).toFixed(1))+'%p',a:(newReadm>GP.tgtReadm?'+':'')+((newReadm-GP.tgtReadm).toFixed(1))+'%p',d:newReadm<=GP.tgtReadm}].map(x=>`<div class="sim-result"><span style="font-size:12px;min-width:110px">${x.l}</span><span class="sim-before">${x.b}</span><span class="sim-arrow">→</span><span class="sim-after" style="color:${x.d?'var(--g600)':'var(--tx2)'}">${x.a}</span></div>`).join('')}`;}
const wf=document.getElementById('gpWF');if(wf){const maxH=100;const items=[{l:'Current',v:'$'+$(GP.pbpm),h:maxH,c:'var(--g0-300)'}];
if(savReadm>0)items.push({l:'CM ↓',v:'-$'+(savReadm/1e3).toFixed(0)+'K',h:Math.max(6,savReadm/curTCOC*maxH*12),c:'var(--g500)'});
if(savED>0)items.push({l:'ED ↓',v:'-$'+(savED/1e3).toFixed(0)+'K',h:Math.max(6,savED/curTCOC*maxH*12),c:'var(--g500)'});
if(savSNF>0)items.push({l:'SNF ↓',v:'-$'+(savSNF/1e3).toFixed(0)+'K',h:Math.max(6,savSNF/curTCOC*maxH*12),c:'var(--g500)'});
if(savMed>0)items.push({l:'Med ↓',v:'-$'+(savMed/1e3).toFixed(0)+'K',h:Math.max(6,savMed/curTCOC*maxH*12),c:'var(--g500)'});
if(provSav>0)items.push({l:'Prov ↓',v:'-$'+(provSav/1e3).toFixed(0)+'K',h:Math.max(6,provSav/curTCOC*maxH*12),c:'var(--t500)'});
items.push({l:'Projected',v:'$'+$(newPBPM),h:Math.round(newPBPM/GP.pbpm*maxH),c:'var(--b500)'});
wf.innerHTML=items.map(b=>`<div class="wf-bar"><div class="wf-val">${b.v}</div><div class="wf-block" style="height:${b.h}px;background:${b.c}"></div><div class="wf-label">${b.l}</div></div>`).join('');}
const tg=document.getElementById('gpTarget');if(tg){const pbpmPct=Math.min(100,Math.max(0,((GP.pbpm-newPBPM)/(GP.pbpm-GP.tgtPBPM))*100));const readmPct=Math.min(100,Math.max(0,((GP.readm-newReadm)/(GP.readm-GP.tgtReadm))*100));
tg.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div class="ib"><div style="font-size:10px;color:var(--tx3);margin-bottom:4px">PBPM target ($${$(GP.tgtPBPM)})</div><div style="height:8px;border-radius:4px;background:var(--g0-100);margin-bottom:3px"><div style="width:${pbpmPct.toFixed(0)}%;height:100%;border-radius:4px;background:${pbpmPct>=100?'var(--g500)':'var(--a400)'}"></div></div><div style="font-size:12px;font-weight:500;color:${pbpmPct>=100?'var(--g600)':'var(--a600)'}">${pbpmPct.toFixed(0)}% achieved</div></div>
<div class="ib"><div style="font-size:10px;color:var(--tx3);margin-bottom:4px">Readmit target (${GP.tgtReadm}%)</div><div style="height:8px;border-radius:4px;background:var(--g0-100);margin-bottom:3px"><div style="width:${readmPct.toFixed(0)}%;height:100%;border-radius:4px;background:${readmPct>=100?'var(--g500)':'var(--a400)'}"></div></div><div style="font-size:12px;font-weight:500;color:${readmPct>=100?'var(--g600)':'var(--a600)'}">${readmPct.toFixed(0)}% achieved</div></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">

<div class="ib"><div style="font-size:10px;color:var(--tx3)">Group share</div><div style="font-size:16px;font-weight:600;color:var(--g600)">$${(totalSav*0.6/1e3).toFixed(0)}K</div></div>
<div class="ib"><div style="font-size:10px;color:var(--tx3)">Per patient</div><div style="font-size:16px;font-weight:600;color:var(--g600)">$${(totalSav/GP.pts).toFixed(0)}</div></div>
</div>`;}
